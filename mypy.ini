# Lenient on purpose (D1): catch real type errors in app/ without demanding full annotations.
[mypy]
python_version = 3.12
ignore_missing_imports = True
check_untyped_defs = False
warn_unused_ignores = False
# Telegram's types are Optional everywhere; strict None-checking can come later.
strict_optional = False
exclude = (?x)(^app/bot/legacy/)

[mypy-app.bot.legacy.*]
ignore_errors = True
