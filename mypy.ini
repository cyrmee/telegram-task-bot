# Lenient on purpose (D1): catch real type errors in app/ without demanding full annotations.
[mypy]
python_version = 3.12
ignore_missing_imports = True
check_untyped_defs = False
warn_unused_ignores = False
# Telegram's types are Optional everywhere; strict None-checking can come later.
strict_optional = False
exclude = (?x)(^app/bot/legacy/)

[mypy-app.bot.legacy.*]
ignore_errors = True

# Stream B modules: temporarily exempt until nest 2 clears their findings
# (rowcount on Result, BotInfo kwargs, MaybeInaccessibleMessage.text_html). Remove this block then.
[mypy-app.bot.*,app.notifications.*]
ignore_errors = True
